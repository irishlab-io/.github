---
name: Reusable - Run GitGuardian scan

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      required:
        description: Fail the job when secrets are found (true) or annotate only (false)
        required: false
        type: boolean
        default: true
    secrets:
      GITGUARDIAN_API_KEY:
        description: Git Guardian API Key
        required: true

jobs:
  secret:
    name: GitGuardian scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: GitGuardian scan
        id: secret
        uses: GitGuardian/ggshield/actions/secret@4cccd600fd3890a7aba07fd0a45e483f3099fe70 # v1.56.1
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        continue-on-error: ${{ !inputs.required }}

      - name: Check status of potentially failing step and issue warning
        if: steps.secret.outcome == 'failure'
        run: |
          echo "::error::The previous step detected potential secrets in the code. Please review the scan report above."
        shell: bash
