---
name: Reusable - Prek


on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      skips:
        description: Prek Skip
        required: false
        type: string
      required:
        description: Fail the job when checks fail (true) or annotate only (false)
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  prek:
    name: Run prek
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Prek Checks
        id: precommit
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        env:
          SKIP: ${{ inputs.skips }}
        continue-on-error: ${{ !inputs.required }}

      - name: Check status of potentially failing step and issue warning
        if: steps.precommit.outcome == 'failure'
        run: |
          echo "::error::The previous step detected potential pre-commit issues in the code. Please review the CI report above."
        shell: bash
