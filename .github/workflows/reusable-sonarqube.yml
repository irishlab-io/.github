---
name: Reusable - Run Sonarqube Scan

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      gating:
        description: Enable Sonarqube Quality Gate
        required: false
        type: boolean
        default: true
    secrets:
      TS_OAUTH_CLIENT_ID:
        description: Tailscale OAuth client ID
        required: true
      TS_OAUTH_CLIENT_SECRET:
        description: Tailscale OAuth client secret
        required: true
      SONARQUBE_TOKEN:
        description: SonarQube Token
        required: true
      SONARQUBE_URL:
        description: SonarQube Host URL
        required: true

permissions:
  contents: read

jobs:
  sonarqube:
    name: Sonarqube Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Call Tailscale Action
        id: tailscale
        uses: irishlab-io/.github/.github/actions/tailscale@main
        with:
          ts-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-client-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: "tag:ci"

      - name: Get Tailscale IP address
        run: |
          tailscale ip -4
        shell: bash

      - name: Run SAST - SonarQube
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONARQUBE_URL }}

      - name: Quality gating SAST - SonarQube
        if: ${{ inputs.gating }}
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
