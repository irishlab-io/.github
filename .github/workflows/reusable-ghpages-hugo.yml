---
name: Reusable - Hugo Deploy to GitHub Pages

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      hugo-version:
        description: >
          Hugo version to install (e.g. "0.167.0" or "latest"). Defaults to a
          pinned release so builds are reproducible; pass "latest" to opt out.
        required: false
        default: "0.167.0"
        type: string
      hugo-extended:
        description: Use Hugo extended edition (required for SCSS/SASS support)
        required: false
        default: true
        type: boolean
      hugo-dir:
        description: Directory where the Hugo site is located
        required: false
        default: .
        type: string
      publish-dir:
        description: Directory where Hugo outputs the built site
        required: false
        default: ./public
        type: string
      hugo-args:
        description: Additional arguments to pass to the hugo build command
        required: false
        default: --minify
        type: string
      submodules:
        description: Checkout strategy for git submodules ("true", "false", or "recursive")
        required: false
        default: "true"
        type: string

    outputs:
      page-url:
        description: URL of the deployed GitHub Pages site
        value: ${{ jobs.deploy.outputs.page-url }}

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:

  build:
    name: Hugo - Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read
      pages: read

    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: ${{ inputs.submodules }}
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: ${{ inputs.hugo-version }}
          extended: ${{ inputs.hugo-extended }}

      - name: Cache Hugo resources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/hugo_cache
            ${{ inputs.hugo-dir }}/resources
          key: hugo-${{ runner.os }}-${{ inputs.hugo-version }}-${{ github.run_id }}
          restore-keys: |
            hugo-${{ runner.os }}-${{ inputs.hugo-version }}-

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build Hugo site
        env:
          HUGO_DIR: ${{ inputs.hugo-dir }}
          HUGO_ARGS: ${{ inputs.hugo-args }}
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
        run: |
          cd "$HUGO_DIR"
          read -r -a hugo_args <<< "$HUGO_ARGS"
          hugo "${hugo_args[@]}"
        shell: bash

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ inputs.publish-dir }}

  deploy:
    name: Hugo - Deploy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    outputs:
      page-url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
