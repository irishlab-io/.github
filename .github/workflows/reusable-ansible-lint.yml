---
name: Reusable - Ansible Lint

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      configuration_file:
        description: Ansible-Lint configuration
        required: false
        default: ""
        type: string
      setup_python:
        description: Setup Python automatically
        required: false
        default: true
        type: boolean
      requirements_file:
        description: Ansible Galaxy requirements files
        required: false
        default: ""
        type: string
      working_directory:
        description: Project directory
        required: false
        default: ""
        type: string

jobs:
  ansible-lint:
    name: Run ansible-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run ansible-lint
        uses: ansible/ansible-lint@9bce2bfb8f4a984e6b13767bc0d6bf0a49492164 # v26.10.1
        with:
          args: ${{ inputs.configuration_file }}
          setup_python: ${{ inputs.setup_python }}
          requirements_file: ${{ inputs.requirements_file }}
          working_directory: ${{ inputs.working_directory }}
