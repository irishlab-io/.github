---
name: Reusable - Ensure SHA Pinned Actions

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      allowlist:
        description: >
          Newline-separated action prefixes exempt from SHA pinning. Defaults
          to the calling repository's owner (e.g. "irishlab-io/").
        required: false
        type: string
        default: ${{ github.repository_owner }}/

permissions:
  contents: read

jobs:
  pinned-actions:
    name: Ensure SHA Pinned Actions
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure SHA pinned actions
        uses: zgosalvez/github-actions-ensure-sha-pinned-actions@76ed8a4c86957c2d27d44bab47f172193149d926 # v5.0.11
        with:
          allowlist: ${{ inputs.allowlist }}
