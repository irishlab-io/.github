---
name: Reusable - Deploy MkDocs to Cloudflare Pages

on: # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      cloudflare-project-name:
        description: Cloudflare Pages project name to deploy to
        required: true
        type: string
      environment:
        description: GitHub deployment environment name
        required: false
        type: string
        default: production
      mkdocs-site-dir:
        description: MkDocs output directory (matches site_dir in mkdocs.yml)
        required: false
        type: string
        default: site
      python-version:
        description: Python version to use
        required: false
        type: string
        default: "3.14"
      uv-version:
        description: UV version to use
        required: false
        type: string
        default: "latest"
      working-directory:
        description: Working directory containing mkdocs.yml
        required: false
        type: string
        default: "."
    secrets:
      CLOUDFLARE_ACCOUNT_ID:
        description: Cloudflare account ID
        required: true
      CLOUDFLARE_API_TOKEN:
        description: Cloudflare API token with Cloudflare Pages edit permissions
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy MkDocs to Cloudflare Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install UV
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          version: ${{ inputs.uv-version }}

      - name: Setup Python ${{ inputs.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: |
          uv sync --all-extras --dev --frozen
        shell: bash

      - name: Build MkDocs site
        working-directory: ${{ inputs.working-directory }}
        env:
          MKDOCS_SITE_DIR: ${{ inputs.mkdocs-site-dir }}
        run: |
          uv run mkdocs build --strict --site-dir "${MKDOCS_SITE_DIR}"
        shell: bash

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ inputs.working-directory }}/${{ inputs.mkdocs-site-dir }} --project-name=${{ inputs.cloudflare-project-name }} --commit-dirty=true

      - name: Minimize UV cache
        run: |
          uv cache prune --ci
        shell: bash
